services:
  kadr:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      DATABASE_PATH: /app/data/kadr.sqlite
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - kadr-data:/app/data
      - kadr-backups:/app/backups
    stop_grace_period: 20s
volumes:
  kadr-data:
  kadr-backups:
